name: Release

on:
  push:
    branches: [main]
  pull_request:

# No file-wide permissions: each job declares exactly what it needs, so the
# pull_request-triggered path never holds a write token.
permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset status diffs against the base branch, which needs history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # A PR with no changeset fails here. A PR that deliberately ships nothing
      # records an explicit empty changeset (`npx changeset --empty`) to pass.
      - name: Check for a changeset
        if: github.event_name == 'pull_request'
        run: npx changeset status --since=origin/${{ github.base_ref }}

  release:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC trusted publishing to npm — no NPM_TOKEN anywhere.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # OIDC trusted publishing requires npm >= 11.5.1, which neither node 20
      # nor node 22 ships. Without this the publish fails to authenticate with
      # an error that does not point at the npm version.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Create Version Packages PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
