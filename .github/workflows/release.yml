name: Release

on:
  push:
    branches: [main]
  pull_request:

# No file-wide permissions: each job declares exactly what it needs, so the
# pull_request-triggered path never holds a write token.
permissions: {}

# Two pushes to main would otherwise race to publish. Never cancel in progress
# — a half-killed publish is worse.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset status diffs against the base branch, which needs history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # A PR you write states its release decision by carrying a changeset —
      # including the explicit empty one (`npx changeset --empty`) that a PR
      # shipping nothing records, rather than leaving "this doesn't release" to
      # be inferred from silence. You never write the version bump yourself;
      # merging to main hands the changesets to the release job, which puts the
      # bump in a "Version Packages" PR of its own.
      #
      # The version-bump branch below is that PR. It carries the bump and no
      # changesets, which is the one shape `changeset status` would reject. In
      # practice this branch is rarely reached: a pull request opened with
      # GITHUB_TOKEN does not trigger workflows, so this job usually does not
      # run on it at all. It is here so the check is still correct if someone
      # pushes to that branch by hand, or re-runs it.
      - name: Check the PR states its release decision
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          if git diff "origin/$BASE_REF...HEAD" -- package.json |
            grep -qE '^\+[[:space:]]*"version":'; then
            echo "PR carries the version bump — this is the Version Packages PR; merging it releases."
            exit 0
          fi
          if npx changeset status --since="origin/$BASE_REF"; then
            exit 0
          fi
          echo "::error::No release decision. Run \`npx changeset\` (or \`npx changeset --empty\` if this PR ships nothing)."
          exit 1
        env:
          BASE_REF: ${{ github.base_ref }}

  release:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push changeset-release/main, and the tag a publish creates.
      pull-requests: write # open and update the Version Packages PR.
      id-token: write # OIDC trusted publishing to npm — no NPM_TOKEN anywhere.
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset version reads history to build the changelog, and pushing
          # from a shallow clone fails with "shallow update not allowed".
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # OIDC trusted publishing requires npm >= 11.5.1, which neither node 20
      # nor node 22 ships. Without this the publish fails to authenticate with
      # an error that does not point at the npm version. Pinned to the 11.x
      # range so a future npm major does not land unreviewed in the publish path.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # Versioning is automatic, and this one step is both halves of it.
      # On a push to main it does exactly one of two things:
      #
      #   - Unconsumed changesets exist: it runs `version`, and opens or
      #     updates the "Version Packages" pull request on the branch
      #     `changeset-release/main`, carrying the bump and the CHANGELOG
      #     entry. Nothing publishes. Merging that PR is the release.
      #   - main is already bumped (you just merged that PR): it runs
      #     `publish`, which ships to npm and pushes the tag.
      #
      # It writes a branch and a pull request, never main. That is what keeps
      # main's ruleset free of a bypass actor — GitHub Actions cannot be one on
      # a user-owned repository, so a job that pushed to main directly could
      # not work here at all.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: npm run version:packages
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # changeset publish shells to `npm publish` without --provenance, so
          # assert it here rather than relying on npm's trusted-publisher default.
          NPM_CONFIG_PROVENANCE: true
